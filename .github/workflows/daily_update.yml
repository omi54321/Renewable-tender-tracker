name: V14 Daily Renewable Tender Update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run scans and tests without modifying the workbook
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "30 2 * * *" # Runs at 02:30 UTC / 08:00 IST
  push:
    branches: [main]
    paths:
      - "Python/**"
      - "Config/**"
      - "tests/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/daily_update.yml"

permissions:
  contents: write

concurrency:
  group: renewable-tender-v14
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      WORKBOOK_PATH: Output/Renewable_Tender_Tracker_V14.xlsx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare runtime folders
        run: |
          mkdir -p Logs backups Data/raw Data/snapshots Data/history Output

      - name: Confirm workbook exists
        run: |
          test -f "$WORKBOOK_PATH"
          ls -lh "$WORKBOOK_PATH"
      - name: Run quality tests
        run: python -m pytest -q
      - name: Determine run mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            MODE=true
          elif [[ "${{ github.event_name }}" == "schedule" ]]; then
            MODE=false
          else
            MODE="${{ github.event.inputs.dry_run }}"
          fi
          echo "dry_run=$MODE" >> "$GITHUB_OUTPUT"
      - name: Run tender update in dry-run mode
        if: ${{ steps.mode.outputs.dry_run == 'true' }}
        run: python -m Python.daily_update --workbook "$WORKBOOK_PATH" --agencies Config/agencies.json --rules Config/scope_rules.json --dry-run
      - name: Run tender update in live mode
        if: ${{ steps.mode.outputs.dry_run == 'false' }}
        run: python -m Python.daily_update --workbook "$WORKBOOK_PATH" --agencies Config/agencies.json --rules Config/scope_rules.json
      - name: Show diagnostics
        if: always()
        run: |
          find Logs -maxdepth 2 -type f -print || true
          test -f Logs/latest_run.json && cat Logs/latest_run.json || true
          test -f Logs/connector_health.json && cat Logs/connector_health.json || true
      - name: Upload workbook and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renewable-tender-tracker-v14-${{ github.run_number }}
          path: |
            Output/Renewable_Tender_Tracker_V14.xlsx
            Logs/
            backups/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit live update
        if: ${{ success() && steps.mode.outputs.dry_run == 'false' }}
        run: |
          git config user.name renewable-tender-bot
          git config user.email renewable-tender-bot@users.noreply.github.com
          git add -A Output Logs backups Data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "V14 automated tender update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD:main
          fi
      - name: Write summary
        if: always()
        run: |
          echo "## V14 Renewable Tender Update" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: ${{ steps.mode.outputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workbook: $WORKBOOK_PATH" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f Logs/latest_run.json ]]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat Logs/latest_run.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
