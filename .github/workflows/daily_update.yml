name: Daily Renewable Tender Update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without modifying workbook"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "30 2 * * *"
  push:
    paths:
      - "Python/**"
      - "Config/**"
      - "requirements.txt"
      - ".github/workflows/daily_update.yml"

permissions:
  contents: write

concurrency:
  group: renewable-tender-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run tender update
        shell: bash
        run: |
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            python -m Python.daily_update --dry-run
          else
            python -m Python.daily_update
          fi

      - name: Upload logs and workbook
        uses: actions/upload-artifact@v4
        with:
          name: renewable-tender-tracker-${{ github.run_number }}
          path: |
            Output/Renewable_Tender_Tracker_V12.xlsx
            Logs/
            backups/
          retention-days: 30

      - name: Commit updated workbook and logs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          git config user.name "renewable-tender-bot"
          git config user.email "renewable-tender-bot@users.noreply.github.com"
          git add Output/Renewable_Tender_Tracker_V12.xlsx Logs/ backups/ Data/
          if git diff --cached --quiet; then
            echo "No workbook changes detected."
          else
            git commit -m "Automated tender update $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Write workflow summary
        shell: bash
        run: |
          echo "## Renewable Tender Tracker V12" >> "$GITHUB_STEP_SUMMARY"
          echo "- Schedule: daily at 08:00 IST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workbook: \`Output/Renewable_Tender_Tracker_V12.xlsx\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: >=100 MW; no rooftop, KUSUM, EPC, supply/install or O&M-only tenders" >> "$GITHUB_STEP_SUMMARY"
          if [ -f Logs/latest_run.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat Logs/latest_run.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
